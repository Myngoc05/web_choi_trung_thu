<div class="big-moon"></div>
<div class="sky" id="sky"></div>
<div class="bg-layer" id="bg-a"></div>
<div class="bg-layer" id="bg-b"></div>
<div class="bg-scrim"></div>
<div id="fireflies"></div>
<div id="lanterns"></div>
<div id="shooting-stars"></div>

<button class="sound-toggle" id="sound-toggle" onclick="toggleSound()" aria-label="Bật/tắt âm thanh">🔊</button>

<!-- 1. WELCOME -->
<section class="screen active" id="screen-welcome">
  <div class="floating-cta-wrap">
    <button class="floating-cta" onclick="startGame()">Bắt đầu ✨</button>
  </div>
</section>

<!-- 2. WHEEL -->
<section class="screen" id="screen-wheel">
  <div class="progress-float">⭐ <span id="wheel-progress">0/6</span> Ngôi Sao</div>
  <div class="sheet-wrap">
    <div class="sheet">
      <div class="wheel-wrap">
        <p class="wheel-hint" id="wheel-hint">Mỗi lần quay, em sẽ nhận được một câu hỏi bí mật. Trả lời đúng để thu thập Ngôi Sao Trung Thu nhé!</p>
        <div class="wheel-glow"></div>
        <div class="wheel-frame" id="wheel-frame">
          <div class="sparkle-ring" id="sparkle-ring"></div>
          <div class="wheel-pointer"></div>
          <div class="wheel-disc" id="wheel-disc">
            <div class="wheel-icon" id="wi0"></div>
            <div class="wheel-icon" id="wi1"></div>
            <div class="wheel-icon" id="wi2"></div>
            <div class="wheel-icon" id="wi3"></div>
            <div class="wheel-icon" id="wi4"></div>
            <div class="wheel-icon" id="wi5"></div>
          </div>
          <div class="wheel-center">🎯</div>
        </div>
        <button class="btn" id="spin-btn" onclick="spinWheel()">Quay Ngay 🎡</button>
      </div>
    </div>
  </div>
</section>

<!-- 3. QUESTION -->
<section class="screen" id="screen-question">
  <div class="progress-float" id="q-progress">0/6</div>
  <div class="sheet-wrap">
    <div class="sheet">
      <div id="q-banner"></div>
      <div class="q-text" id="q-text">Câu hỏi ở đây</div>
      <div class="retry-msg" id="q-retry"></div>
      <div id="q-options"></div>
    </div>
  </div>
</section>

<!-- 4. FEEDBACK -->
<section class="screen" id="screen-feedback">
  <div class="feedback-panel">
    <div class="fb-mascot" id="fb-mascot"></div>
    <h2 style="font-size:25px; color:var(--jade-deep);">Chính xác!</h2>
    <div class="star-gain">+1 Ngôi Sao <span id="fb-progress">(1/6)</span></div>
    <div class="explain-box" id="fb-explain">Giải thích ở đây</div>
    <button class="btn secondary" id="fb-continue-btn" onclick="afterFeedback()">Quay tiếp 🎡</button>
  </div>
</section>

<!-- 5. COMPLETE -->
<section class="screen" id="screen-complete">
  <div class="sheet-wrap">
    <div class="sheet">
      <p class="center-note">Các em đã trả lời đúng cả 6 câu hỏi Trung Thu!</p>
      <button class="btn" onclick="showScreen('reward')">Nhận phần thưởng 🎁</button>
    </div>
  </div>
</section>

<!-- 6. REWARD -->
<section class="screen" id="screen-reward">
  <div class="sheet-wrap">
    <div class="sheet">
      <div class="btn-row">
       
        <!-- Đổi hàm onClick ở đây -->
        <button class="btn" onclick="showPreparedImage()">Chụp khoảnh khắc</button>
      </div>
      
      <!-- KHUNG CHỨA ẢNH CÓ SẴN (Mặc định ẩn) -->
      <img id="my-prepared-image" src="image/ket.png" style="display:none; width:100%; margin-top:16px; border-radius:12px; border:3px solid #f6c453; box-shadow:0 8px 16px rgba(0,0,0,0.2);">
      <button class="btn ghost" onclick="showScreen('outro')" style="margin-top:8px;">Tiếp theo →</button>
    </div>
  </div>
</section>

<!-- 7. OUTRO -->
<section class="screen" id="screen-outro">
  <div class="floating-cta-wrap">
    <button class="floating-cta" onclick="resetGame()" style="animation:none;">Chơi lại từ đầu ↺</button>
  </div>
</section>

<canvas id="capture-canvas" width="800" height="1000"></canvas>
<audio id="bg-music" src="audio/ruocDen.mp3" loop></audio>
<script src="main.js"></script>
</body>
</html>
